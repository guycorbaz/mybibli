# Full local stack: app + persistent MariaDB + persistent covers.
#
# All configuration values live in .env — nothing in this file needs editing.
#
# Persistent state lives in three named volumes (all survive `docker compose
# down` AND `docker compose up -d` after a `pull`):
#   - `mybibli_db_data`  — MariaDB data directory
#   - `mybibli_covers`   — downloaded cover JPGs (issue #213)
#   - `mybibli_logs`     — rotated daily log files (CR #301, v1.7.0)
# Back the data + covers volumes up together — losing one without the other
# will surface as half-broken (DB references that point at missing covers or
# vice versa). The logs volume is forensic-only, can be wiped at any time.
#
# To use an EXTERNAL database instead:
#   1. Comment out (or delete) the `db:` service.
#   2. Remove `mybibli_db_data:` from the `volumes:` block at the bottom.
#   3. Comment out the `depends_on:` block on the `mybibli` service.
#   4. Set MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE
#      in your .env to point at the external DB.
# Keep `mybibli_covers:` even with an external DB — covers are local to
# this app instance.

services:
  mybibli:
    build: .
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-mybibli}:${MYSQL_PASSWORD:-mybibli_password}@${MYSQL_HOST:-db}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-mybibli}?charset=utf8mb4
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      RUST_LOG: ${RUST_LOG:-mybibli=info}
      # CR #301 (v1.7.0): runtime log-level control. Takes precedence
      # over RUST_LOG. Accepts a plain level (trace / debug / info /
      # warn / error) or a tracing-subscriber EnvFilter directive list
      # like `mybibli=debug,sqlx=warn`. Default `info` is
      # production-safe. For an active investigation, set
      # `MYBIBLI_LOG_LEVEL=mybibli=debug` (or `mybibli=trace` for the
      # deepest level) and restart the container.
      MYBIBLI_LOG_LEVEL: ${MYBIBLI_LOG_LEVEL:-info}
      # CR #301: directory where the daily-rotating log files land.
      # Files are named `mybibli.log.YYYY-MM-DD`. Older than 30 days
      # are auto-purged by a background task. Override the path if
      # you want logs somewhere other than the default container path.
      MYBIBLI_LOG_DIR: ${MYBIBLI_LOG_DIR:-/var/log/mybibli}
      APP_LANGUAGE: ${APP_LANGUAGE:-en}
      MYBIBLI_COOKIE_SECURE: ${MYBIBLI_COOKIE_SECURE:-false}
    volumes:
      # Issue #213 — cover images MUST persist across container upgrades.
      # The Rust binary writes cover JPGs into `/app/covers` (resolved
      # from `COVERS_DIR=./covers` against WORKDIR /app). Without this
      # mount, every `docker compose up -d` after a `docker compose pull`
      # destroys the writable layer holding the accumulated covers.
      #
      # The named volume `mybibli_covers` works zero-config — Docker
      # manages persistence, backup via `docker volume`. If you prefer a
      # bind mount visible in the host filesystem (Synology DSM, manual
      # rsync backups), comment the line below and uncomment the second:
      - mybibli_covers:/app/covers
      # - ${COVERS_HOST_PATH:-./covers-host}:/app/covers
      # CR #301 (v1.7.0) — persistent log directory. Survives
      # `docker compose pull && up -d` so a NAS operator can
      # `tail -f` historical logs after an upgrade. Daily rotation
      # is in-process via `tracing-appender::rolling::daily`; files
      # older than 30 days are purged by a background task. Wipe
      # this volume at any time — it's forensic-only.
      - mybibli_logs:/var/log/mybibli
      # Or a bind mount if you want logs visible in the host
      # filesystem (Synology DSM Log Center, journald shipping):
      # - ${LOGS_HOST_PATH:-./logs-host}:/var/log/mybibli
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mybibli}
      MYSQL_USER: ${MYSQL_USER:-mybibli}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mybibli_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mybibli_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mybibli_db_data:
  mybibli_covers:
  mybibli_logs:
