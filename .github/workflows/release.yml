name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify Cargo.toml version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag vs Cargo.toml
        id: check
        # #30 sub-item 1: extract the version via Python's stdlib tomllib
        # (3.11+, available on ubuntu-latest) instead of grep. Robust
        # against UTF-8 BOM, CRLF, single-quoted values, and a future
        # [workspace.package] section. tomllib is a real TOML parser so
        # only the actual [package].version is read.
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # #450: release-candidate tags (v1.16.0-rc.1) are accepted and
          # publish a Docker image under their full version string. They
          # can never become :latest — the is-highest gate below only
          # considers final v<MAJ>.<MIN>.<PATCH> tags, so an rc is always
          # "not highest" by construction — and they do not sync the
          # Docker Hub overview (same gate). Any other suffix is refused.
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match v<MAJOR>.<MINOR>.<PATCH> or v<MAJOR>.<MINOR>.<PATCH>-rc.<N>"
            exit 1
          fi
          CARGO_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION) — bump Cargo.toml and re-tag"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Verified version $CARGO_VERSION matches tag $GITHUB_REF_NAME"

  gates:
    needs: verify-version
    uses: ./.github/workflows/_gates.yml

  publish:
    name: Build & push Docker Hub release tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-version, gates]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if pushed tag is the highest semver
        id: is-highest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HIGHEST=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V \
            | tail -1)
          if [ -z "$HIGHEST" ]; then
            echo "::error::Could not determine highest semver tag via GitHub API"
            exit 1
          fi
          if [ "$HIGHEST" = "$GITHUB_REF_NAME" ]; then
            echo "is_highest=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME is the highest semver — :latest will be updated"
          else
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME is NOT the highest semver (highest is $HIGHEST) — :latest will NOT be updated"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gcorbaz/mybibli
          tags: |
            type=raw,value=${{ needs.verify-version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.is-highest.outputs.is_highest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # #447 — stamp the commit into the binary so it identifies itself
          # in the production log.
          build-args: |
            MYBIBLI_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sync Docker Hub overview (the README-equivalent shown on
      # hub.docker.com/r/gcorbaz/mybibli) with docs/dockerhub-overview.md.
      # Runs only when this tag is the highest semver — same gate as the
      # `:latest` Docker tag promotion above. Pre-release / hotfix tags
      # to older lines must not overwrite the overview with stale content.
      # Source file lives in the repo (version-controlled, doc-sync'd per
      # Foundation Rule #19).
      - name: Sync Docker Hub overview
        if: steps.is-highest.outputs.is_highest == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: gcorbaz/mybibli
          short-description: "Self-hosted personal library catalog — Rust + Axum + MariaDB. Single-tenant, single household, runs on your NAS."
          readme-filepath: ./docs/dockerhub-overview.md

      - name: Summary
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
