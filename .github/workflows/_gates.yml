name: Gates (reusable)

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust-tests:
    name: Rust tests + clippy + sqlx-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `cargo test --lib` covers the `#[sqlx::test]` cases introduced in story
    # 7-3 (src/routes/auth.rs language_tests and src/middleware/locale.rs
    # middleware_integration_tests). Those macros provision a throwaway DB via
    # `MARIADB_ROOT_PASSWORD` and need `DATABASE_URL` at runtime — otherwise
    # the process panics with `DATABASE_URL must be set: EnvVar(NotPresent)`.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_test
          MARIADB_DATABASE: mybibli_rust_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root_test@127.0.0.1:3307/mybibli_rust_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features mysql,rustls --locked

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit & bin tests
        run: cargo test --lib --bins

      # `cargo sqlx prepare --check` regenerates `.sqlx/` against a live DB to
      # compare with the committed cache. `#[sqlx::test]` creates throwaway DBs
      # via admin, so `mybibli_rust_test` itself stays empty — we need to run
      # the migrations manually here so the SQL macros resolve.
      - name: Apply migrations to rust-test DB
        run: sqlx migrate run --source ./migrations

      - name: Check SQLx offline metadata
        run: cargo sqlx prepare --check --workspace -- --all-targets

  db-integration:
    name: DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_test
          MARIADB_DATABASE: mybibli_rust_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root_test@127.0.0.1:3307/mybibli_rust_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run DB-backed integration tests
        run: |
          cargo test \
            --test admin_audit_fk_set_null \
            --test find_similar \
            --test find_by_location_dewey \
            --test metadata_fetch_dewey \
            --test metadata_fetch_race \
            --test seed_gate \
            --test seeded_users \
            --test setup_wizard \
            --test system_user \
            --test users_in_allowed_tables

      - name: Collect MariaDB logs on failure
        if: failure() || cancelled()
        run: |
          set +e
          CID=$(docker ps --filter "ancestor=mariadb:10.11" --format '{{.ID}}' | head -1)
          if [ -n "$CID" ]; then
            docker logs "$CID" 2>&1 | tail -200 > /tmp/mariadb.log || true
          fi

      - name: Upload MariaDB logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mariadb.log
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Build and start E2E stack
        run: docker compose -f tests/e2e/docker-compose.test.yml up -d --build --wait

      - name: Install E2E deps
        working-directory: tests/e2e
        run: npm ci

      - name: Typecheck E2E (tsc --noEmit)
        working-directory: tests/e2e
        run: npx tsc --noEmit

      - name: Grep gate — no page.waitForTimeout in specs
        working-directory: tests/e2e
        run: |
          if grep -rE "waitForTimeout\(" specs/ helpers/; then
            echo "::error::page.waitForTimeout is forbidden — use DOM-state assertions."
            exit 1
          fi

      # Fix #106 — story 9-2 added `#recent-additions` above
      # `#browse-results` on the home page. Both render
      # `<a href="/title/N">` blocks. Any spec using
      # `page.locator('a[href^="/title/"]').first()` after
      # `goto("/?q=...")` ends up selecting the recent-additions
      # link instead of the search-result link and silently tests
      # the wrong target. Three specs (dewey-code, csp-headers,
      # title-detail-volumes) hit this on story 9-2; they were
      # patched to scope via `#browse-results table.browse-table
      # tbody tr td a[href^="/title/"]`. This gate prevents the
      # next story from re-introducing the regression by failing
      # the build at PR time, before CI burns a 10-minute
      # Playwright run on red.
      - name: Grep gate — no unscoped title-link selector on home-page specs
        working-directory: tests/e2e
        run: |
          if grep -rE 'page\.locator\(["'"'"']a\[href\^=["'"'"']/title/' specs/ ; then
            echo "::error::Unscoped \`a[href^=\"/title/\"]\` selector found. Scope to \`#browse-results table.browse-table tbody tr td a[href^=\"/title/\"]\` or a \`<section>.locator(...)\` chain to skip the recent-additions strip."
            exit 1
          fi

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: tests/e2e
        run: npm test

      - name: Collect compose logs
        if: always()
        run: |
          docker compose -f tests/e2e/docker-compose.test.yml logs --no-color > /tmp/compose-logs.txt || true

      - name: Stop E2E stack
        if: always()
        run: docker compose -f tests/e2e/docker-compose.test.yml down -v || true

      - name: Upload Playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload compose logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

  # Story 8-8 review P2 — wizard E2E lane.
  # The base e2e job above runs against the seeded stack with
  # `MYBIBLI_SKIP_SETUP=1`, so the wizard spec is dead in CI. This job
  # spawns the same stack with the env var unset and an empty `users`
  # table, then runs ONLY the wizard spec (gated behind
  # MYBIBLI_SETUP_E2E=1 in the spec itself). Foundation Rule #7:
  # every epic must have a smoke test running on every CI build.
  e2e-wizard:
    name: Playwright wizard E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Build and start E2E stack with wizard override
        run: |
          docker compose \
            -f tests/e2e/docker-compose.test.yml \
            -f tests/e2e/docker-compose.wizard.yml \
            up -d --build --wait

      - name: Wipe seeded users so the wizard predicate fires
        # `sessions.user_id` carries an FK to `users.id` with no CASCADE
        # (`fk_sessions_user`, story 1 initial schema), so a bare
        # `DELETE FROM users` aborts with 23000. Drop the dependent
        # session rows first; `admin_audit` cascades on user delete so
        # we don't have to touch it explicitly.
        run: |
          docker compose \
            -f tests/e2e/docker-compose.test.yml \
            -f tests/e2e/docker-compose.wizard.yml \
            exec -T db mariadb -uroot -proot_test mybibli_test \
              -e "DELETE FROM sessions; DELETE FROM users;"

      - name: Restart mybibli so it re-reads MYBIBLI_SKIP_SETUP="" and the empty users table
        run: |
          docker compose \
            -f tests/e2e/docker-compose.test.yml \
            -f tests/e2e/docker-compose.wizard.yml \
            restart mybibli
          # Boot is fast — give the listener a moment to bind before
          # Playwright connects. Cargo's debug-build container starts in
          # ~2 s on warm CI; the 5-s sleep here is generous.
          sleep 5

      - name: Install E2E deps
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run wizard spec
        working-directory: tests/e2e
        env:
          MYBIBLI_SETUP_E2E: "1"
        run: npx playwright test specs/journeys/setup-wizard.spec.ts

      - name: Collect compose logs
        if: always()
        run: |
          docker compose \
            -f tests/e2e/docker-compose.test.yml \
            -f tests/e2e/docker-compose.wizard.yml \
            logs --no-color > /tmp/wizard-compose-logs.txt || true

      - name: Stop E2E stack
        if: always()
        run: |
          docker compose \
            -f tests/e2e/docker-compose.test.yml \
            -f tests/e2e/docker-compose.wizard.yml \
            down -v || true

      - name: Upload Playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-wizard-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload compose logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/wizard-compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore
