# Dependency advisory scan (RustSec).
#
# Why a schedule and not just push: an advisory is published against a
# version you already ship, without any commit on your side. A scanner
# wired only to `push` is silent exactly when nothing changes — which is
# the situation it exists for. The daily run is the load-bearing part;
# the push trigger only shortens the loop when a dependency moves.
#
# Failure policy lives in `.cargo/audit.toml`: vulnerabilities gate,
# informational warnings (unmaintained / unsound / yanked) are reported
# but do not fail the job. Accepted advisories are listed there with the
# reason they are accepted.
name: Audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # 05:17 UTC daily — off the hour, so we are not queued behind the
    # crowd that picks midnight.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-18
        with:
          toolchain: stable

      # cargo-audit is installed rather than pulled as a third-party
      # action: this job exists to reduce supply-chain exposure, so it
      # should not add a new action to the trust set to do it.
      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.22.1

      # Floor is 0.22, not 0.21: the RustSec database now carries
      # advisories scored with CVSS v4 (e.g. RUSTSEC-2026-0066), and
      # 0.21 aborts on the whole database rather than the one entry it
      # cannot parse — "unsupported CVSS version: 4.0". Anyone auditing
      # locally with an older binary will hit the same wall.
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version '^0.22'

      - name: Scan Cargo.lock against the RustSec advisory database
        run: cargo audit

      # A green job above means "no unignored vulnerability". The
      # warnings still deserve eyes, so surface them in the run summary
      # rather than leaving them buried in the log.
      - name: Summarise informational warnings
        if: always()
        run: |
          {
            echo "## cargo audit — informational warnings"
            echo
            echo '```'
            cargo audit 2>&1 | grep -E "^(Crate|Warning|Title|ID):" || echo "none"
            echo '```'
            echo
            echo "Accepted advisories and their rationale: \`.cargo/audit.toml\`."
          } >> "$GITHUB_STEP_SUMMARY"
