[package]
name = "mybibli"
version = "1.8.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
askama = { version = "0.15.4", features = ["urlencode"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "mysql", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
# CR #301 (v1.7.0) — `env-filter` enables the `MYBIBLI_LOG_LEVEL` /
# `RUST_LOG` runtime control of which targets and levels are emitted.
tracing-subscriber = { version = "0.3", features = ["json", "time", "env-filter"] }
# CR #301 (v1.7.0) — production debuggability on NAS deployments.
# `tracing-appender` provides a non-blocking, daily-rotating file writer
# that pairs with the existing stdout subscriber so `docker logs` AND
# `tail -f /var/log/mybibli/mybibli.log.YYYY-MM-DD` both work.
tracing-appender = "0.2"
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "timeout", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
argon2 = "0.5"
image = "0.25"
barcoders = "2"
rand = "0.8"
rust-i18n = "3.1.5"
axum-extra = { version = "0.10", features = ["cookie"] }
time = "0.3"
async-trait = "0.1"
base64 = "0.22"
percent-encoding = "2"
# Admin Health tab (story 8-1) — disk-usage via statvfs(2). Linux-only.
# The `fs` feature is enough; avoids pulling in `sysinfo`'s CPU/memory/network surface.
nix = { version = "0.29", features = ["fs"] }
# CSRF middleware (story 8-2) — constant-time byte comparison for token
# validation. Token length is small; `==` is not constant-time.
subtle = "2.6"
serde_urlencoded = "0.7"
# CR #266 — server-rendered PDF export for the wish list (`/wishlist/export.pdf`).
# Pure Rust, mid-level layout API on top of `printpdf`. ~250 KB extra in the
# release binary; uses DejaVu Sans (TTF in `static/fonts/`) for unicode support.
genpdf = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_yaml = "0.9"
regex = "1"
# Captures tracing events emitted during a test so we can assert on
# security-audit warnings (story 8-2 §Ships 16 — CSRF-rejection warn log).
tracing-test = "0.2"
# CR #301 (v1.7.0) — temp directories for the log_purge retention tests.
# Pure unit tests; no DB needed.
tempfile = "3"
