services:
  rust-test-db:
    image: mariadb:10.11
    container_name: mybibli-rust-test-db
    ports:
      # Host port overridable when 3307 is taken on the machine (#717).
      - "127.0.0.1:${MYBIBLI_RUST_TEST_DB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root_test
      MARIADB_DATABASE: mybibli_rust_test
      MARIADB_USER: test
      MARIADB_PASSWORD: test
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20
