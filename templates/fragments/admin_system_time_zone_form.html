{# Admin → System → time zone form (story 15-1, #602). Text input with a
   datalist of every IANA zone name; the server validates the exact
   spelling. CSRF token is the FIRST input (audit invariant). #}
<form id="admin-system-time-zone-form"
      method="POST"
      action="/admin/system/time-zone"
      hx-post="/admin/system/time-zone"
      hx-target="#admin-system-time-zone-form"
      hx-swap="outerHTML"
      class="mt-4 border border-stone-200 dark:border-stone-700 rounded-lg p-4 bg-stone-50 dark:bg-stone-900">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token|e }}">
    <input type="hidden" name="time_zone_version" value="{{ time_zone_version }}">
    <label class="block">
        <span class="block text-sm font-medium mb-1">{{ time_zone_label }}</span>
        <input type="text"
               id="time-zone"
               name="time_zone"
               list="time-zone-names"
               autocomplete="off"
               spellcheck="false"
               required
               value="{{ time_zone_value|e }}"
               class="w-72 px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-md dark:bg-stone-800">
        <span class="block text-xs text-stone-500 dark:text-stone-400 mt-1">{{ time_zone_help }}</span>
    </label>
    <datalist id="time-zone-names">
        {% for name in zone_names %}<option value="{{ name }}">{% endfor %}
    </datalist>
    <div class="mt-3">
        <button type="submit"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm">{{ btn_save }}</button>
    </div>
</form>
