{# CR #443 — Labels section list. HTMX target for create/rename/delete. #}
<ul id="admin-ref-labels-list" role="list" class="divide-y divide-stone-200 dark:divide-stone-700">
    {% if entries.is_empty() %}
        <li class="py-3 text-stone-500 dark:text-stone-400">{{ empty_state }}</li>
    {% else %}
        {% for entry in entries %}
            {% include "fragments/admin_ref_label_row.html" %}
        {% endfor %}
    {% endif %}
</ul>
