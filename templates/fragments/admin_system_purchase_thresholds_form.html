{# Admin → System → Proposals, story 16-3 (#639): from when an agent may
   propose replacing a purchase price. CSRF token is the FIRST input (audit
   invariant). #}
<form id="admin-system-purchase-thresholds-form"
      method="POST"
      action="/admin/system/purchase-thresholds"
      hx-post="/admin/system/purchase-thresholds"
      hx-target="#admin-system-purchase-thresholds-form"
      hx-swap="outerHTML"
      class="mt-4 border border-stone-200 dark:border-stone-700 rounded-lg p-4 bg-stone-50 dark:bg-stone-900">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token|e }}">
    <input type="hidden" name="negligible_version" value="{{ negligible_version }}">
    <input type="hidden" name="gap_version" value="{{ gap_version }}">
    <label class="block">
        <span class="block text-sm font-medium mb-1">{{ negligible_label }}</span>
        <input type="number"
               id="purchase-negligible-amount"
               name="negligible_amount"
               min="0"
               max="99999999.99"
               step="0.01"
               required
               value="{{ negligible_value }}"
               class="w-32 px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-md dark:bg-stone-800">
        <span class="block text-xs text-stone-500 dark:text-stone-400 mt-1">{{ negligible_help }}</span>
    </label>
    <label class="block mt-3">
        <span class="block text-sm font-medium mb-1">{{ gap_label }}</span>
        <input type="number"
               id="purchase-gap-factor"
               name="gap_factor"
               min="{{ gap_min }}"
               max="{{ gap_max }}"
               step="1"
               required
               value="{{ gap_value }}"
               class="w-32 px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-md dark:bg-stone-800">
        <span class="block text-xs text-stone-500 dark:text-stone-400 mt-1">{{ gap_help }}</span>
    </label>
    <div class="mt-3">
        <button type="submit"
                id="purchase-thresholds-save"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm">{{ btn_save }}</button>
    </div>
</form>
