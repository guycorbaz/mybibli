{# Admin → System → Loans form (story 8-5). Single integer input for the
   overdue threshold. CSRF token is the FIRST input (audit invariant). #}
<form id="admin-system-loans-form"
      method="POST"
      action="/admin/system/loans"
      hx-post="/admin/system/loans"
      hx-target="#admin-system-loans-form"
      hx-swap="outerHTML"
      class="border border-stone-200 dark:border-stone-700 rounded-lg p-4 bg-stone-50 dark:bg-stone-900">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token|e }}">
    <input type="hidden" name="overdue_threshold_version" value="{{ overdue_threshold_version }}">
    <label class="block relative">
        <span class="block text-sm font-medium mb-1">{{ overdue_threshold_label }}{% let tooltip = overdue_threshold_tooltip %}{% include "components/tooltip.html" %}</span>
        <input type="number"
               name="overdue_threshold_days"
               min="1"
               max="365"
               step="1"
               required
               value="{{ overdue_threshold_value }}"
               class="w-32 px-3 py-2 border border-stone-300 dark:border-stone-700 rounded-md dark:bg-stone-800">
        <span class="block text-xs text-stone-500 dark:text-stone-400 mt-1">{{ overdue_threshold_help }}</span>
    </label>
    <div class="mt-3">
        <button type="submit"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm">{{ btn_save }}</button>
    </div>
</form>
