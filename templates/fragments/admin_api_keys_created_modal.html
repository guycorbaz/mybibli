{# CR #241 — one-time plaintext display modal. Shown once after a
   successful POST /admin/api-keys; after dismiss, only the argon2
   hash + 12-char prefix remain in the DB.
   No hx-confirm=, no inline scripts/styles (CSP 'self'). #}
<dialog open aria-modal="true" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 rounded-lg">
    <div class="bg-white dark:bg-stone-900 rounded-lg shadow-xl max-w-xl w-full mx-4 border border-stone-200 dark:border-stone-700">
        <div class="p-6 space-y-4">
            <h3 class="text-lg font-bold text-stone-900 dark:text-white">{{ heading }}</h3>
            <p class="text-stone-700 dark:text-stone-300">{{ body }}</p>
            <div class="bg-stone-100 dark:bg-stone-800 rounded p-3 font-mono text-sm break-all" data-api-key-plaintext>{{ plaintext }}</div>
            <p class="text-xs text-stone-500 dark:text-stone-400">{{ copy_hint }}</p>
            <div class="flex justify-end">
                <button type="button" data-action="admin-modal-close" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-semibold">{{ btn_close }}</button>
            </div>
        </div>
    </div>
</dialog>
