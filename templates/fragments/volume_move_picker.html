{# Story 13-8 — title picker of the move modal (rendered into body_html). #}
<p class="mb-3">{{ intro }}</p>
<label for="volume-move-search" class="block text-sm font-medium text-stone-700 dark:text-stone-300 mb-1">{{ search_label }}</label>
<input type="search" id="volume-move-search" name="q" autocomplete="off" data-modal-default-focus
       hx-get="/volume/{{ volume_id }}/move/candidates"
       hx-trigger="input changed delay:300ms, search"
       hx-target="#volume-move-candidates" hx-swap="innerHTML"
       placeholder="{{ search_placeholder }}"
       class="w-full px-3 py-2 border border-stone-300 dark:border-stone-600 rounded-md bg-white dark:bg-stone-800 text-stone-900 dark:text-stone-100">
<div id="volume-move-candidates" class="mt-2 max-h-64 overflow-y-auto **:scroll-mt-0!" aria-live="polite"></div>
